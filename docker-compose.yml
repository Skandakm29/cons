services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildbid
      POSTGRES_PASSWORD: buildbid
      POSTGRES_DB: buildbid
    ports:
      # Host port 5433 avoids clashing with a locally installed Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildbid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
